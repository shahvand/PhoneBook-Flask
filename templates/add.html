<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اضافه کردن مخاطب جدید - دفترچه تلفن</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .add-form {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            font-family: 'Vazirmatn', sans-serif;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #007bff;
        }
        
        .required {
            color: red;
        }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }
        
        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-family: 'Vazirmatn', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: background-color 0.3s;
        }
        
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #545b62;
        }
        
        .alert {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .page-title {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="لوگو" class="logo">
                <h1>دفترچه تلفن</h1>
            </div>
        </header>

        <main>
            <h2 class="page-title">اضافه کردن مخاطب جدید</h2>
            
            <!-- نمایش پیام‌های flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'success' if category == 'success' else 'error' }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST" class="add-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="form-group">
                    <label for="full_name">نام کامل <span class="required">*</span></label>
                    <input type="text" id="full_name" name="full_name" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">شماره تلفن <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" required placeholder="مثال: 021-12345678">
                </div>
                
                <div class="form-group">
                    <label for="position">سمت</label>
                    <input type="text" id="position" name="position" placeholder="مثال: مدیر فروش">
                </div>
                
                <div class="form-group">
                    <label for="department">دپارتمان</label>
                    <input type="text" id="department" name="department" placeholder="مثال: بازاریابی">
                </div>
                
                <div class="form-group">
                    <label for="location">مکان</label>
                    <input type="text" id="location" name="location" placeholder="مثال: طبقه دوم، اتاق 205">
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">اضافه کردن مخاطب</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">انصراف</a>
                </div>
            </form>
        </main>

        <footer>
            <p>&copy; 2024 دفترچه تلفن. تمامی حقوق محفوظ است.</p>
        </footer>
    </div>

    <script>
        // فوکوس روی فیلد اول
        document.getElementById('full_name').focus();
        
        // اعتبارسنجی فرم
        document.querySelector('form').addEventListener('submit', function(e) {
            const fullName = document.getElementById('full_name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            if (!fullName || !phone) {
                e.preventDefault();
                alert('لطفاً نام کامل و شماره تلفن را وارد کنید.');
            }
        });
    </script>
</body>
</html>
