<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ویرایش مخاطب</title>
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('/static/fonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        /* نوار کناری مدرن */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 220px;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            border-left: 1px solid #e0e0e0;
        }
        .sidebar a {
            color: #333333;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            text-align: right;
            direction: rtl;
            transition: background-color 0.2s;
            font-family: 'Vazirmatn', sans-serif;
        }
        .sidebar a:hover {
            background-color: #f5f5f5;
        }
        .sidebar img {
            width: 24px;
            height: 24px;
            margin-left: 15px;
        }
        .main-content {
            margin-right: 230px;
            padding: 20px;
            background-color: #fff;
            min-height: 100vh;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            font-family: 'Vazirmatn', sans-serif;
        }
        form {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fafafa;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 15px;
            color: #34495e;
            font-size: 18px;
            font-family: 'Vazirmatn', sans-serif;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            font-family: 'Vazirmatn', sans-serif;
        }
        input[readonly] {
            background-color: #e9ecef;
            cursor: not-allowed;
        }
        button {
            margin-top: 25px;
            padding: 12px;
            width: 100%;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 18px;
            transition: background-color 0.2s;
            font-family: 'Vazirmatn', sans-serif;
        }
        button:hover {
            background-color: #0056b3;
        }
        a.back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007BFF;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.2s;
            font-family: 'Vazirmatn', sans-serif;
        }
        a.back-link:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- نوار کناری -->
    <div class="sidebar">
        <a href="{{ url_for('index') }}" title="دفترچه تلفن">
            <img src="/static/phonebook_icon.png" alt="دفترچه تلفن">
            دفترچه تلفن
        </a>
    </div>

    <div class="main-content">
        <h1>ویرایش مخاطب</h1>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="hidden" name="computer_name" id="computer_name" value="">
            
            <label>نام و نام خانوادگی:</label>
            <input type="text" name="full_name" value="{{ contact['full_name'] }}" required>

            <label>تلفن:</label>
            <input type="text" name="phone" value="{{ contact['phone'] }}" required readonly>

            <label>سمت:</label>
            <input type="text" name="position" value="{{ contact['position'] }}">

            <label>دپارتمان:</label>
            <input type="text" name="department" value="{{ contact['department'] }}">

            <label>محل استقرار:</label>
            <input type="text" name="location" value="{{ contact['location'] }}">

            <button type="submit">ذخیره</button>
        </form>
        <a href="{{ url_for('index') }}" class="back-link">بازگشت به لیست مخاطبین</a>
    </div>

    <script>
        // دریافت نام کامپیوتر از سمت کلاینت
        async function getComputerName() {
            try {
                let computerName = '';
                
                // ابتدا چک کن که آیا نام کامپیوتر در localStorage ذخیره شده
                const savedComputerName = localStorage.getItem('computer_name');
                if (savedComputerName && savedComputerName !== 'کاربر-ناشناس') {
                    return savedComputerName;
                }
                
                // روش 1: استفاده از ActiveX برای Windows (فقط در IE/Edge legacy)
                try {
                    if (window.ActiveXObject || "ActiveXObject" in window) {
                        const network = new ActiveXObject("WScript.Network");
                        computerName = network.ComputerName;
                        if (computerName) {
                            localStorage.setItem('computer_name', computerName);
                            return computerName;
                        }
                    }
                } catch (e) {
                    // ActiveX در دسترس نیست
                }
                
                // روش 2: درخواست از API سرور
                try {
                    const response = await fetch('/api/computer-name');
                    const data = await response.json();
                    if (data.computer_name && data.computer_name !== 'کاربر-ناشناس') {
                        computerName = data.computer_name;
                        localStorage.setItem('computer_name', computerName);
                        return computerName;
                    }
                } catch (e) {
                    console.log('خطا در دریافت نام از API:', e);
                }
                
                // روش 3: درخواست از کاربر برای وارد کردن نام کامپیوتر
                computerName = prompt('لطفاً نام کامپیوتر خود را وارد کنید:\n(این نام برای شناسایی شما در لاگ‌ها استفاده می‌شود)', savedComputerName || '');
                if (!computerName || computerName.trim() === '') {
                    computerName = 'کاربر-ناشناس';
                }
                
                // ذخیره نام کامپیوتر در localStorage
                localStorage.setItem('computer_name', computerName);
                
                return computerName;
            } catch (error) {
                console.log('خطا در دریافت نام کامپیوتر:', error);
                return 'کاربر-ناشناس';
            }
        }
        
        // تنظیم نام کامپیوتر در فیلد مخفی
        document.addEventListener('DOMContentLoaded', async function() {
            const computerNameField = document.getElementById('computer_name');
            const computerName = await getComputerName();
            computerNameField.value = computerName;
            console.log('نام کامپیوتر تشخیص داده شده:', computerName);
            
            // اضافه کردن دکمه برای تغییر نام کامپیوتر
            const form = document.querySelector('form');
            const changeNameButton = document.createElement('button');
            changeNameButton.type = 'button';
            changeNameButton.textContent = 'تغییر نام کامپیوتر';
            changeNameButton.style.marginTop = '10px';
            changeNameButton.style.backgroundColor = '#6c757d';
            changeNameButton.onclick = function() {
                const newName = prompt('نام جدید کامپیوتر را وارد کنید:', computerName);
                if (newName && newName.trim() !== '') {
                    localStorage.setItem('computer_name', newName.trim());
                    computerNameField.value = newName.trim();
                    alert('نام کامپیوتر تغییر کرد: ' + newName.trim());
                }
            };
            form.appendChild(changeNameButton);
        });
    </script>
</body>
</html>
